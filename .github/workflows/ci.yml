name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only. Nothing in this workflow writes to the repo, and a fork PR
# should not be handed anything more than it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces with the repo .npmrc, and it documents the intent at
  # the CI layer. This runner is linux/x64 - the ONE platform whose
  # onnxruntime-node manifest defaults to ["cuda12"] and pulls the GPU
  # execution providers from nuget. There is no GPU here or on Vercel.
  ONNXRUNTIME_NODE_INSTALL: skip
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

  # Turbo's cache is per-runner and every run gets a fresh one, so a
  # local cache buys nothing here. Remote caching is deliberately NOT
  # configured: a misconfigured one serves stale results that look like
  # passes, which is worse than no cache at all. Correctness first.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # lfs: true is load-bearing. Without it checkout leaves ~130 byte
      # pointer files in place of the model, everything looks present,
      # and the first thing to touch it fails with an opaque ONNX parse
      # error. The postinstall hash check catches that too, but only
      # after a confusing install.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Git LFS state
        run: git lfs ls-files

      # Must come before setup-node: `cache: pnpm` needs pnpm on PATH to
      # resolve the store directory.
      #
      # No `version` on purpose. pnpm/action-setup reads the
      # `packageManager` field from package.json, so the version is
      # pinned in exactly one place rather than two that can drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the point of this step, not a detail. It
      # fails when pnpm-lock.yaml disagrees with any package.json, which
      # is what catches a dependency added locally and never committed -
      # otherwise invisible until someone clones fresh.
      - name: Install
        # postinstall runs scripts/verify-models.mjs, which hashes the
        # pinned artifacts and fails loudly on an unresolved LFS pointer.
        run: pnpm install --frozen-lockfile

      # This is the platform where the GPU providers would land, so it is
      # the only place the skip can actually be verified. Locally on
      # macOS the manifest is empty and the bug is invisible.
      - name: Assert no GPU execution providers were installed
        run: |
          echo "platform: $(node -p "process.platform + '/' + process.arch")"
          found=$(find node_modules -name 'libonnxruntime_providers_*' 2>/dev/null | head -20)
          if [ -n "$found" ]; then
            echo "::error::GPU execution providers were installed:"
            echo "$found"
            du -sh node_modules/.pnpm/onnxruntime-node*/node_modules/onnxruntime-node 2>/dev/null || true
            exit 1
          fi
          echo "none present."
          echo "onnxruntime-node on disk: $(du -sh node_modules/.pnpm/onnxruntime-node*/node_modules/onnxruntime-node 2>/dev/null | cut -f1)"

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # The one that matters. Every package typechecks through
      # tsconfig.test.json, which includes the test files - that is what
      # keeps the compile-time assertions in the mirror tests honest.
      # They regressed silently once because tests were excluded here.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Deliberately no PPS_TEST_DATABASE_URL and no PPS_TEST_HEIC.
        #
        # The migration suites need a Postgres with pgvector and pg_cron,
        # and the HEIC suite needs a real iPhone photo that is never
        # committed. Both skip cleanly when their variable is absent, so
        # a fork PR with no secrets gets a green run rather than a
        # confusing failure. See the README for how to run them locally.
        run: pnpm test

      - name: Report skipped suites
        if: always()
        run: |
          echo "Integration suites NOT run in CI (they skip without their env var):"
          echo "  - migrations + concurrency   need PPS_TEST_DATABASE_URL"
          echo "  - real iPhone HEIC           needs PPS_TEST_HEIC"
          echo "Run them locally: see README > Database and README > HEIC."
